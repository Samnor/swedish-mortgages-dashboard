name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package*.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v6.2.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run validate
          python3 -m py_compile scripts/export_public_dashboard_data.py
