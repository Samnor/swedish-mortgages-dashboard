name: Refresh Data

on:
  schedule:
    - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: dashboard-data-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      source_environment: ${{ steps.env.outputs.source_environment }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE_ENV="${{ inputs.environment }}"
          else
            SOURCE_ENV="prod"
          fi
          if [ "$SOURCE_ENV" = "prod" ]; then
            DEPLOY_ENV="prod-data"
          else
            DEPLOY_ENV="$SOURCE_ENV"
          fi
          echo "environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "source_environment=$SOURCE_ENV" >> "$GITHUB_OUTPUT"

  refresh:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      STATIC_BUCKET: ${{ vars.STATIC_BUCKET }}
      STATIC_PREFIX: ${{ vars.STATIC_PREFIX || 'mortgages' }}
      ATHENA_OUTPUT_LOCATION: ${{ vars.ATHENA_OUTPUT_LOCATION || 's3://athena-queries-funfun/dashboard-exports/' }}
      ATHENA_WORKGROUP: ${{ vars.ATHENA_WORKGROUP || 'primary' }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Check refresh configuration
        id: preflight
        run: |
          missing=0
          for name in AWS_ROLE_ARN STATIC_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing $name; refresh will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "refresh_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.preflight.outputs.refresh_ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export public dashboard data
        if: steps.preflight.outputs.refresh_ready == 'true'
        run: |
          python3 scripts/export_public_dashboard_data.py \
            --environment "${{ needs.resolve.outputs.source_environment }}" \
            --athena-output "$ATHENA_OUTPUT_LOCATION" \
            --workgroup "$ATHENA_WORKGROUP" \
            --output dist/data

      - name: Upload dashboard data
        if: steps.preflight.outputs.refresh_ready == 'true'
        run: |
          aws s3 sync dist/data "s3://${STATIC_BUCKET}/${STATIC_PREFIX}/data/" \
            --delete \
            --cache-control "public,max-age=300"

      - name: Invalidate dashboard data
        if: steps.preflight.outputs.refresh_ready == 'true' && env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/${STATIC_PREFIX}/data/latest.json"
